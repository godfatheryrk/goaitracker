name: E2E

on:
  pull_request:
  push:
    branches: [main]

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate
          npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare E2E database
        # Playwright starts webServer BEFORE globalSetup, and with
        # SESSION_DRIVER=database the `/` readiness probe 500s on an unmigrated
        # DB — so the server never reports ready and webServer times out.
        # Pre-migrate here so the probe succeeds; globalSetup then re-runs
        # migrate:fresh for a clean per-suite slate.
        run: |
          touch database/e2e.sqlite
          php artisan migrate:fresh --seed --force
        env:
          APP_ENV: local
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/e2e.sqlite

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

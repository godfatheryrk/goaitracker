name: AI Review

# Setup & operations: docs/ai-code-review-pipeline.md
# ON-DEMAND + ADVISORY: this review runs only when the `ai-cr:review` label is added to a PR,
# and it does NOT block merge (do not add `ai-code-review` to required status checks).
# Required config (manual, GitHub UI):
#   - Secret  ANTHROPIC_API_KEY  (console key — REQUIRED by this workflow)
#   - Variable AI_REVIEW_MODEL   (optional model override; default claude-sonnet-4-6)
#   - Labels ai-cr:passed / ai-cr:failed / ai-cr:review (the last one triggers a run)
# (OPENROUTER_API_KEY is only for the promptfoo evals in code-review-evals/, not this workflow.)

on:
  # On-demand only: the review runs when the `ai-cr:review` label is added to a PR.
  pull_request:
    branches: [main]
    types: [labeled]
  workflow_dispatch:

# Minimal permissions: read code, write PR comments + labels. No contents:write — review-only.
permissions:
  contents: read
  pull-requests: write

# One in-flight review per PR; a new push cancels the previous run.
concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ai-code-review:
    name: ai-code-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Run on opened/synchronize and manual dispatch; for `labeled`, only the on-demand retry label.
    # Run on manual dispatch, or when the `ai-cr:review` label is added.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'ai-cr:review'
    steps:
      # Fail fast (before checkout / npm) with a clear message if the key is absent. This catches a
      # MISSING/empty secret; an invalid key is caught later by the agent and the failure handler.
      - name: Preflight — require ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is missing or empty — see docs/ai-code-review-pipeline.md."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the diff vs base resolves

      - name: Compute diff vs base
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Exclude generated/lockfile/build noise — it costs tokens but isn't reviewable.
          EXCLUDES=(
            ':(exclude)**/package-lock.json'
            ':(exclude)**/*.lock'
            ':(exclude)**/dist/**'
            ':(exclude)**/node_modules/**'
          )
          if [ -n "$BASE_SHA" ]; then
            git diff "$BASE_SHA"...HEAD -- . "${EXCLUDES[@]}" > pr.diff
          else
            git fetch origin main --depth=1
            git diff origin/main...HEAD -- . "${EXCLUDES[@]}" > pr.diff
          fi
          echo "Diff lines: $(wc -l < pr.diff)"

      - name: Run AI reviewer
        id: review
        uses: ./.github/actions/ai-reviewer
        with:
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          diff-file: pr.diff
          pr-title: ${{ github.event.pull_request.title }}
          pr-body: ${{ github.event.pull_request.body }}
          # Override the model without editing files: set repo Actions variable AI_REVIEW_MODEL
          # (e.g. claude-haiku-4-5). Falls back to Sonnet when unset.
          model: ${{ vars.AI_REVIEW_MODEL || 'claude-sonnet-4-6' }}

      - name: Sticky comment + labels
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          VERDICT: ${{ steps.review.outputs.verdict }}
        run: |
          set -euo pipefail
          # Build the sticky comment (hidden marker lets us find + update it on re-runs).
          {
            echo "<!-- ai-cr -->"
            echo "## 🤖 AI Code Review — \`$VERDICT\`"
            echo
            echo "| Kryterium | Ocena | Werdykt |"
            echo "|---|---|---|"
            jq -r '.criteria[] | "| \(.name) | \(.score)/10 | \(.verdict) |"' review.json
            echo
            jq -r '.summary' review.json
          } > comment.md

          # Sticky: find an existing marked comment and PATCH it, else create a new one.
          CID=$(gh api "repos/$REPO/issues/$PR/comments" \
            --jq 'map(select(.body | startswith("<!-- ai-cr -->"))) | first | .id // empty')
          if [ -n "$CID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$CID" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi

          # Labels: pass/fail (and clear the retry trigger so it can be re-added).
          if [ "$VERDICT" = "pass" ]; then
            gh pr edit "$PR" --add-label "ai-cr:passed" --remove-label "ai-cr:failed" || true
          else
            gh pr edit "$PR" --add-label "ai-cr:failed" --remove-label "ai-cr:passed" || true
          fi
          gh pr edit "$PR" --remove-label "ai-cr:review" || true

      # Advisory only — the verdict lives in the label + sticky comment; the job stays green so it
      # never blocks merge. To turn this into a hard gate later, restore `test "$verdict" = pass`
      # and add `ai-code-review` to the branch's required status checks.
      - name: Report verdict (advisory)
        run: |
          echo "Verdict: ${{ steps.review.outputs.verdict }} — advisory only; does not block merge."

      # If anything above failed (missing/invalid key, agent error, timeout), surface it on the PR and
      # clear the trigger label so it doesn't silently stick. PR events only, failure only.
      - name: On failure — notify PR and clear trigger label
        if: ${{ failure() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "<!-- ai-cr -->"
            echo "## 🤖 AI Code Review — \`error\`"
            echo
            echo "The review could not run, so no verdict was produced. A common cause is a missing or"
            echo "invalid \`ANTHROPIC_API_KEY\` secret; see the [run logs]($RUN_URL) for the exact error."
            echo
            echo "Re-add the \`ai-cr:review\` label to retry once it is fixed."
          } > error-comment.md
          CID=$(gh api "repos/$REPO/issues/$PR/comments" \
            --jq 'map(select(.body | startswith("<!-- ai-cr -->"))) | first | .id // empty')
          if [ -n "$CID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$CID" -F body=@error-comment.md >/dev/null
          else
            gh pr comment "$PR" --body-file error-comment.md
          fi
          gh pr edit "$PR" --remove-label "ai-cr:review" || true

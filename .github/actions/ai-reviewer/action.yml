name: AI Reviewer
description: Run GOAITracker's Claude Agent SDK code-review agent and emit a pass/fail verdict.

branding:
  icon: check-circle
  color: purple

inputs:
  api-key:
    description: Anthropic console API key (NOT a subscription login).
    required: true
  diff-file:
    description: Repo-relative path to the unified PR diff to review.
    required: true
  pr-title:
    description: Pull request title (optional context for the agent).
    required: false
  pr-body:
    description: Pull request body (optional context for the agent).
    required: false
  model:
    description: Anthropic model id for the review (e.g. claude-sonnet-4-6, claude-haiku-4-5).
    required: false
    default: claude-sonnet-4-6

outputs:
  verdict:
    description: Overall verdict — "pass" or "fail".
    value: ${{ steps.agent.outputs.verdict }}
  report-file:
    description: Path to the written review.json.
    value: ${{ steps.agent.outputs.report }}

runs:
  using: composite
  steps:
    - name: Configure Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install reviewer dependencies
      shell: bash
      working-directory: packages/code-reviewer
      run: npm ci

    - name: Run review agent
      id: agent
      shell: bash
      working-directory: packages/code-reviewer
      env:
        ANTHROPIC_API_KEY: ${{ inputs.api-key }}
        AI_REVIEW_MODEL: ${{ inputs.model }}
        DIFF_FILE: ${{ github.workspace }}/${{ inputs.diff-file }}
        CRITERIA_FILE: ${{ github.workspace }}/.github/review/criteria.md
        REPORT_FILE: ${{ github.workspace }}/review.json
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
      run: |
        npm run review
        verdict=$(jq -r '.overall_verdict' "$REPORT_FILE")
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        echo "report=$REPORT_FILE" >> "$GITHUB_OUTPUT"
        echo "AI review verdict: $verdict"
